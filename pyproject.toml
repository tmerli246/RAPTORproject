[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tps5d"
version = "0.2.0"
description = "5D-TPS: adaptation, fractionation and capacity-constrained allocation for adaptive proton therapy"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.9",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]